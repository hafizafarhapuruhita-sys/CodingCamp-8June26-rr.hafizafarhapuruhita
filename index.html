<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <title>Expense & Budget Visualizer</title>
</head>
<body>
    <h1>Expense & Budget Visualizer</h1>
<div class="balance-card">
    <p>Total Balance</p>
    <h2 id="totalAmount">Rp0</h2>
</div>

<form>
    <label>Nama Transaksi</label>
    <br>
    <input type="text" id="transactionName">
    <br><br>

    <label>Jumlah</label>
    <br>
    <input type="text" id="transactionAmount"
/>
    <br><br>

    <label>Kategori</label>
    <br>
    <select id="transactionCategory">
    <option>Food</option>
    <option>Transport</option>
    <option>Fun</option>
    </select>

<br><br>

    <button type="button" id="addButton">Tambah</button>
</form>

<hr>

<h2>Daftar Transaksi</h2>

<ul id="transactionList">
</ul>
    <script src="js/script.js"></script>
</body>
</html>
