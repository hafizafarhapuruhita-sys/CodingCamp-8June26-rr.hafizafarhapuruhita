<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <title>Expense & Budget Visualizer</title>
</head>
<body>
    <h1>Expense & Budget Visualizer</h1>
    <button type="button" id="themeButton">
    Dark Mode
    </button>
<div class="balance-card">
    <p>Total Balance</p>
    <h2 id="totalAmount">Rp0</h2>
</div>

<form>
    <h2>Set Your Spending Limit!</h2>
    <label>Spending Limit</label>
    <br>
    <input type="text" id="spendingLimit">
    <h2>Add Transaction</h2>
    <label>Item Name</label>
    <br>
    <input type="text" id="transactionName">
    <br><br>
    
    <label>Amount</label>
    <br>
    <input type="text" id="transactionAmount"/>
    <br><br>

    <label>Category</label>
    <br>
    <select id="transactionCategory">
    <option>Food</option>
    <option>Transport</option>
    <option>Fun</option>
    </select>

<br><br>

    <button type="button" id="addButton">Add Transaction</button>
</form>

<hr>

<div class="content-section">

    <div class="transaction-section">
        <h2>Transactions</h2>
        <ul id="transactionList"></ul>
    </div>
    
    <div class="chart-section">
        <h2>Spending by Category</h2>
        <canvas id="expenseChart"></canvas>
    </div>

</div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
